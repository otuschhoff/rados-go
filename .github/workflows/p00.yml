name: P00 through P03 verification

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    outputs:
      go-matrix: ${{ steps.read.outputs.go-matrix }}
      minimum-go: ${{ steps.read.outputs.minimum-go }}
      ceph-commit: ${{ steps.read.outputs.ceph-commit }}
      ceph-image: ${{ steps.read.outputs.ceph-image }}
      compiler: ${{ steps.read.outputs.compiler }}
      ceph-devel: ${{ steps.read.outputs.ceph-devel }}
      cephpp-devel: ${{ steps.read.outputs.cephpp-devel }}
      devel-repository: ${{ steps.read.outputs.devel-repository }}
      ceph-devel-amd64-sha256: ${{ steps.read.outputs.ceph-devel-amd64-sha256 }}
      ceph-devel-arm64-sha256: ${{ steps.read.outputs.ceph-devel-arm64-sha256 }}
      cephpp-devel-amd64-sha256: ${{ steps.read.outputs.cephpp-devel-amd64-sha256 }}
      cephpp-devel-arm64-sha256: ${{ steps.read.outputs.cephpp-devel-arm64-sha256 }}
      librados: ${{ steps.read.outputs.librados }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: read
        run: |
          echo "go-matrix=$(jq -c '[.go.minimum.version,.go.latest.version] | map(ltrimstr("go"))' docs/p00/evidence.json)" >> "$GITHUB_OUTPUT"
          echo "minimum-go=$(jq -r '.go.minimum.version | ltrimstr("go")' docs/p00/evidence.json)" >> "$GITHUB_OUTPUT"
          echo "ceph-commit=$(jq -r '.ceph.source_baseline.commit' docs/p00/evidence.json)" >> "$GITHUB_OUTPUT"
          echo "ceph-image=$(jq -r '.images.qualification.reference' docs/p00/evidence.json)" >> "$GITHUB_OUTPUT"
          echo "compiler=$(jq -r '.oracle.compiler' docs/p00/evidence.json)" >> "$GITHUB_OUTPUT"
          echo "ceph-devel=$(jq -r '.oracle.ceph_devel' docs/p00/evidence.json)" >> "$GITHUB_OUTPUT"
          echo "cephpp-devel=$(jq -r '.oracle.cephpp_devel' docs/p00/evidence.json)" >> "$GITHUB_OUTPUT"
          echo "devel-repository=$(jq -r '.oracle.devel_repository' docs/p00/evidence.json)" >> "$GITHUB_OUTPUT"
          echo "ceph-devel-amd64-sha256=$(jq -r '.oracle.ceph_devel_amd64_sha256' docs/p00/evidence.json)" >> "$GITHUB_OUTPUT"
          echo "ceph-devel-arm64-sha256=$(jq -r '.oracle.ceph_devel_arm64_sha256' docs/p00/evidence.json)" >> "$GITHUB_OUTPUT"
          echo "cephpp-devel-amd64-sha256=$(jq -r '.oracle.cephpp_devel_amd64_sha256' docs/p00/evidence.json)" >> "$GITHUB_OUTPUT"
          echo "cephpp-devel-arm64-sha256=$(jq -r '.oracle.cephpp_devel_arm64_sha256' docs/p00/evidence.json)" >> "$GITHUB_OUTPUT"
          echo "librados=$(jq -r '.oracle.librados' docs/p00/evidence.json)" >> "$GITHUB_OUTPUT"

  verify:
    needs: pins
    timeout-minutes: 20
    strategy:
      matrix:
        go: ${{ fromJSON(needs.pins.outputs.go-matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          check-latest: false
      - name: Check pinned source and generated inventory
        if: matrix.go == needs.pins.outputs.minimum-go
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/ceph/ceph.git /tmp/go-librados-ceph
          git -C /tmp/go-librados-ceph sparse-checkout init --no-cone
          git -C /tmp/go-librados-ceph sparse-checkout set src/include/rados/librados.h src/include/rados/librados.hpp COPYING
          git -C /tmp/go-librados-ceph checkout "${{ needs.pins.outputs.ceph-commit }}"
          GO111MODULE=off go run ./tools/p00-verify -ceph-source /tmp/go-librados-ceph
          make inventory
          git diff --exit-code -- docs/p00/api-inventory.csv
      - run: make verify-p03

  p03-quality:
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.pins.outputs.minimum-go }}
          check-latest: false
      - run: make quality-p03

  p03-fuzz:
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.pins.outputs.minimum-go }}
          check-latest: false
      - run: make ${{ github.event_name == 'schedule' && 'fuzz-p03-nightly' || 'fuzz-p03' }}

  p03-fixtures-and-integration:
    needs: pins
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            architecture: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      P03_PLATFORM: ${{ matrix.platform }}
      P03_REPORT: docs/p03/integration-report-${{ matrix.architecture }}.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.pins.outputs.minimum-go }}
          check-latest: false
      - run: make reproduce-p03-fixtures integration-p03
      - run: CGO_ENABLED=0 go run ./tools/p03-verify
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p03-integration-${{ matrix.architecture }}
          path: ${{ env.P03_REPORT }}
          if-no-files-found: error

  p02-quality:
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.pins.outputs.minimum-go }}
          check-latest: false
      - run: make quality-p02

  p02-fuzz:
    if: github.event_name == 'schedule'
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.pins.outputs.minimum-go }}
          check-latest: false
      - run: make fuzz-p02-nightly

  p02-fuzz-smoke:
    if: github.event_name != 'schedule'
    needs: pins
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.pins.outputs.minimum-go }}
          check-latest: false
      - run: make fuzz-p02

  p02-fixtures:
    needs: pins
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      P02_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make reproduce-p02

  p01-quality:
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.pins.outputs.minimum-go }}
          check-latest: false
      - name: Reject production cgo imports
        run: test -z "$(go list -deps -f '{{if .CgoFiles}}{{.ImportPath}}{{end}}' ./...)"
      - name: Verify dependency and license boundary
        run: test -z "$(go list -deps -f '{{with .Module}}{{if ne .Path "github.com/otuschhoff/go-librados"}}{{.Path}}{{end}}{{end}}' . ./internal/encoding ./internal/protocol | sort -u)"
      - name: Race test
        run: go test -race ./...
      - name: Static analysis
        run: go run "honnef.co/go/tools/cmd/staticcheck@$(jq -r '.quality_tools.staticcheck' docs/p01/evidence.json)" ./...
      - name: Vulnerability scan
        run: go run "golang.org/x/vuln/cmd/govulncheck@$(jq -r '.quality_tools.govulncheck' docs/p01/evidence.json)" ./...

  p01-fuzz:
    if: github.event_name == 'schedule'
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.pins.outputs.minimum-go }}
          check-latest: false
      - run: make fuzz-p01-nightly

  p01-fuzz-smoke:
    if: github.event_name != 'schedule'
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ needs.pins.outputs.minimum-go }}
          check-latest: false
      - run: make fuzz-p01

  p01-fixtures:
    needs: pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: make reproduce-p01

  oracle-build:
    needs: pins
    runs-on: ubuntu-latest
    strategy:
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: |
          docker build --platform "linux/${{ matrix.architecture }}" \
            --build-arg "CEPH_IMAGE=${{ needs.pins.outputs.ceph-image }}" \
            --build-arg "COMPILER_PACKAGE=${{ needs.pins.outputs.compiler }}" \
            --build-arg "CEPH_DEVEL_PACKAGE=${{ needs.pins.outputs.ceph-devel }}" \
            --build-arg "CEPHPP_DEVEL_PACKAGE=${{ needs.pins.outputs.cephpp-devel }}" \
            --build-arg "CEPH_DEVEL_REPOSITORY=${{ needs.pins.outputs.devel-repository }}" \
            --build-arg "CEPH_DEVEL_AMD64_SHA256=${{ needs.pins.outputs.ceph-devel-amd64-sha256 }}" \
            --build-arg "CEPH_DEVEL_ARM64_SHA256=${{ needs.pins.outputs.ceph-devel-arm64-sha256 }}" \
            --build-arg "CEPHPP_DEVEL_AMD64_SHA256=${{ needs.pins.outputs.cephpp-devel-amd64-sha256 }}" \
            --build-arg "CEPHPP_DEVEL_ARM64_SHA256=${{ needs.pins.outputs.cephpp-devel-arm64-sha256 }}" \
            --build-arg "LIBRADOS_PACKAGE=${{ needs.pins.outputs.librados }}" \
            integration/p00/oracle